<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Island Snow</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- top bar -->
  <nav class="navbar bg-light">

    <div class="container">

      <!-- left icons -->
      <ul class="nav">

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-github"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-twitter"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-pinterest"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-instagram"></i>
          </a>
        </li>

      </ul>


      <!-- right icons -->
      <ul class="nav justify-content-end">

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-house-fill"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-search"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a href="#" class="text-dark">
            <i class="bi bi-person-fill"></i>
          </a>
        </li>


        <!-- cart dropdown -->
        <li class="nav-item dropdown p-1">

          <a
            class="nav-link dropdown-toggle text-dark p-0"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
          >
            <i class="bi bi-cart"></i> 0
          </a>

          <ul class="dropdown-menu dropdown-menu-end">

            <li>
              <a class="dropdown-item" href="#">
                My Cart
              </a>
            </li>

          </ul>

        </li>

      </ul>

    </div>

  </nav>



  <!-- main page -->
  <div class="container">

    <!-- island snow logo -->
    <div class="row">

      <div class="col">

        <img
          src="islandsnow.png"
          alt="Island Snow"
          class="img-fluid rounded mx-auto d-block py-1"
        >

      </div>

    </div>


    <!-- second menu -->
    <div class="row justify-content-center pt-4 text-center middle-menu">

      <div class="col-auto">
        MEN <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col-auto">
        WOMEN <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col-auto">
        KIDS <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col-auto">
        BRANDS <i class="bi bi-caret-down-fill"></i>
      </div>

      <div class="col-auto">
        SEARCH
      </div>

    </div>


    <!-- model bridge -->
    <div class="row justify-content-center mt-2">

      <div class="col">

        <img
          src="modelbridge.png"
          alt="Island Snow model sitting on bridge"
          class="img-fluid w-100"
        >

      </div>

    </div>

  </div>



  <!-- footer -->
  <footer>

    <div class="container">

      <div class="row py-4">


        <!-- navigation -->
        <div class="col-md-4">

          <h6>NAVIGATION</h6>

          <hr>

          <p>
            About Us<br>
            Employment<br>
            Videos
          </p>

        </div>


        <!-- main menu -->
        <div class="col-md-4">

          <h6>MAIN MENU</h6>

          <hr>

          <p>
            Men<br>
            Women<br>
            Kids
          </p>

        </div>


        <!-- connect -->
        <div class="col-md-4">

          <h6>CONNECT</h6>

          <hr>

          <p>
            Sign up for the latest updates
          </p>

          <div class="input-group">

            <input
              type="text"
              class="form-control"
              placeholder="Enter Email Address"
            >

            <button
              class="btn btn-dark"
              type="button"
            >
              Join
            </button>

          </div>

        </div>


      </div>

    </div>

  </footer>



  <!-- bs js -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
